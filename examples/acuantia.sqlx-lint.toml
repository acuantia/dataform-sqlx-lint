# Example: the house configuration this linter was extracted from.
# Copy to <your dataform repo>/.sqlx-lint.toml and adapt.

# Environment suffixes that must never be hardcoded in schema: (E003) —
# the --schema-suffix flag appends them at run time.
schema_suffixes = ["_prod", "_dev"]

# Opt-in house-style rules:
#   E005 — operations/assertions must not set schema: (hasOutput ops exempt)
#   W008 — post_operations {} should follow the main SELECT (style only;
#          Dataform accepts either placement)
enable = ["E005", "W008"]

# E010 column-doc coverage, scoped to the output layer: the Looker tables and the
# reports views read by Google Sheets and ad-hoc consumers. Only columns the resolver
# can determine statically are checked; a `*` through a JS-generated column hides the
# whole star. Remove to enforce coverage everywhere.
coverage_paths = ["definitions/output/looker/", "definitions/output/reports/"]

# E011 — foreign keys on Looker output tables are declared once in includes/keys.js and
# emitted by ${keys.fkAdd(self, ref)}; a hand-written ADD CONSTRAINT ... FOREIGN KEY would
# drift from the orphan assertions generated from the same map.
foreign_key_paths = ["definitions/output/looker/"]
foreign_key_hint = "includes/keys.js"

# Naming/type policies per directory (E007).
[[dir_policies]]
path_contains = "definitions/output/looker/"
require_prefix = "looker_"
require_types = ["table", "incremental"]

[[dir_policies]]
path_contains = "definitions/intermediate/looker/"
require_prefix = "vw_"
severity = "warning"
